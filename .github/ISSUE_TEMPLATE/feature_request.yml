name: Feature Request
description: Suggest a feature for Nemo Tracker
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve?
      placeholder: I'm frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How do you think this should work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives have you considered?
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Analytics
        - Billing
        - User Management
        - Reseller System
        - UI/UX
        - API
        - Integration
        - Other
