version: "3.8"

services:
  tracker:
    build: .
    container_name: nemo_tracker
    restart: unless-stopped
    env_file: .env
    ports:
      - "8090:8080"
    volumes:
      - ./data:/app/data
    depends_on:
      - db
    networks:
      - nemo_net

  db:
    image: postgres:16-alpine
    container_name: nemo_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nemo_tracker
      POSTGRES_USER: nemo_tracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - nemo_net

  redis:
    image: redis:7-alpine
    container_name: nemo_tracker_redis
    restart: unless-stopped
    networks:
      - nemo_net

volumes:
  pgdata:

networks:
  nemo_net:
    driver: bridge
