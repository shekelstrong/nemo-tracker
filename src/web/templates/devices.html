{% extends "base.html" %}
{% block title %}Devices — Nemo Tracker{% endblock %}
{% block topbar_title %}nav.devices{% endblock %}

{% block content %}
<!-- Summary Cards -->
<div class="stats-grid" id="devStats" style="margin-bottom:28px"></div>

<!-- Table -->
<div class="glass-card" style="padding:0;overflow:hidden">
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr>
        <th data-i18n="users.username">Username</th>
        <th data-i18n="dev.unique_ips">Unique IPs</th>
        <th data-i18n="dev.limit">Limit</th>
        <th data-i18n="users.status">Status</th>
      </tr></thead>
      <tbody id="devBody"></tbody>
    </table>
  </div>
</div>

<div id="devLoading"><div class="spinner"></div></div>

<!-- Detail Modal -->
<div class="modal-overlay" id="devModal">
  <div class="modal">
    <button class="modal-close" onclick="closeDevModal()">&times;</button>
    <h3 id="devModalTitle"></h3>
    <div id="devModalContent"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let allDevices = [];

function devStatusBadge(count, limit) {
  if (limit && count > limit) return '<span class="badge badge-disabled">' + t('dev.over_limit') + '</span>';
  if (limit && count === limit) return '<span class="badge badge-limited">' + t('dev.at_limit') + '</span>';
  return '<span class="badge badge-active">' + t('dev.ok') + '</span>';
}

function miniBar(pct) {
  return `<div class="mini-bar"><div class="fill" style="width:${Math.min(pct,100)}%"></div></div>`;
}

function renderDevices() {
  let over = 0, at = 0, ok = 0;
  allDevices.forEach(d => {
    if (d.device_limit && d.unique_ips > d.device_limit) over++;
    else if (d.device_limit && d.unique_ips === d.device_limit) at++;
    else ok++;
  });

  document.getElementById('devStats').innerHTML = `
    <div class="stat-card"><div class="stat-info"><h3 data-i18n="dev.total">${t('dev.total')}</h3><div class="value">${allDevices.length}</div></div><div class="stat-icon purple"><i class="fas fa-laptop"></i></div></div>
    <div class="stat-card"><div class="stat-info"><h3 data-i18n="dev.over_limit">${t('dev.over_limit')}</h3><div class="value">${over}</div></div><div class="stat-icon" style="background:var(--badge-disabled-bg);color:var(--accent-red)"><i class="fas fa-exclamation-triangle"></i></div></div>
    <div class="stat-card"><div class="stat-info"><h3 data-i18n="dev.at_limit">${t('dev.at_limit')}</h3><div class="value">${at}</div></div><div class="stat-icon orange"><i class="fas fa-exclamation-circle"></i></div></div>
    <div class="stat-card"><div class="stat-info"><h3 data-i18n="dev.ok">${t('dev.ok')}</h3><div class="value">${ok}</div></div><div class="stat-icon green"><i class="fas fa-check-circle"></i></div></div>
  `;

  document.getElementById('devBody').innerHTML = allDevices.map(d => {
    const pct = d.device_limit ? (d.unique_ips / d.device_limit * 100) : 0;
    return `
      <tr onclick="openDevModal('${d.username}')">
        <td><div class="user-cell"><div class="avatar">${d.username[0].toUpperCase()}</div>${d.username}</div></td>
        <td>${d.unique_ips} ${miniBar(pct)}</td>
        <td>${d.device_limit || '∞'}</td>
        <td>${devStatusBadge(d.unique_ips, d.device_limit)}</td>
      </tr>
    `;
  }).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--text-3);padding:40px">No data</td></tr>';
}

async function openDevModal(username) {
  try {
    const data = await fetchApi('/api/devices/' + username);
    document.getElementById('devModalTitle').textContent = username;
    document.getElementById('devModalContent').innerHTML = `
      <p style="margin-bottom:12px;color:var(--text-2)">${t('dev.limit')}: ${data.device_limit || '∞'}</p>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>IP</th><th>${t('ud.location')}</th><th>${t('ud.last_seen')}</th></tr></thead>
          <tbody>${(data.ips || []).map(ip => `
            <tr><td style="font-family:monospace">${ip.ip}</td><td>${ip.country || '?'} ${ip.city || ''}</td><td>${ip.last_seen || '—'}</td></tr>
          `).join('') || '<tr><td colspan="3" style="color:var(--text-3)">No IPs</td></tr>'}</tbody>
        </table>
      </div>
    `;
    document.getElementById('devModal').classList.add('open');
  } catch {}
}

function closeDevModal() {
  document.getElementById('devModal').classList.remove('open');
}

document.getElementById('devModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeDevModal();
});

async function onPageLoad() {
  try {
    allDevices = await fetchApi('/api/devices');
    document.getElementById('devLoading').style.display = 'none';
    renderDevices();
  } catch (e) {
    document.getElementById('devLoading').innerHTML = '<p style="text-align:center;color:var(--accent-red)">Failed to load</p>';
  }
}

function onPageLangChange() { onPageLoad(); }
</script>
{% endblock %}
