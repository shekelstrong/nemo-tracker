<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nemo Tracker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: #1a1a2e; --bg2: #16213e; --bg3: #0f3460;
  --card: #1e2a4a; --card2: #253355;
  --accent: #4fc3f7; --green: #66bb6a; --red: #ef5350; --yellow: #ffa726;
  --text: #e0e0e0; --text2: #9e9e9e; --text3: #616161;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  padding-bottom: 70px; -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

/* Header */
.header {
  padding: 16px; text-align: center;
  background: var(--bg2); position: sticky; top: 0; z-index: 10;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.header h1 { font-size: 18px; font-weight: 600; }

/* Bottom nav */
.nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg2); display: flex;
  border-top: 1px solid rgba(255,255,255,0.1); z-index: 100;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav button {
  flex: 1; padding: 10px 0 8px; border: none; background: none;
  color: var(--text3); font-size: 11px; display: flex;
  flex-direction: column; align-items: center; gap: 3px;
  -webkit-tap-highlight-color: transparent;
}
.nav button.active { color: var(--accent); }
.nav button .ico { font-size: 20px; }

/* Tab content */
.tab { display: none; padding: 12px; }
.tab.active { display: block; }

/* Cards grid */
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.card {
  background: var(--card); border-radius: var(--radius); padding: 14px;
}
.card .label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.card .value { font-size: 24px; font-weight: 700; }
.card .value.green { color: var(--green); }
.card .value.blue { color: var(--accent); }
.card .value.red { color: var(--red); }

/* Chart */
.chart-wrap {
  background: var(--card); border-radius: var(--radius);
  padding: 14px; margin-bottom: 14px;
}
.chart-wrap h3 { font-size: 14px; margin-bottom: 10px; }
.chart-wrap canvas { width: 100%; height: 120px; }

/* Alerts mini */
.alerts-mini { display: flex; flex-direction: column; gap: 8px; }
.alert-item {
  background: var(--card); border-radius: var(--radius); padding: 12px;
  display: flex; align-items: center; gap: 10px;
}
.alert-item .icon { font-size: 18px; }
.alert-item .msg { flex: 1; font-size: 13px; }
.alert-item .time { font-size: 11px; color: var(--text2); }

/* Users list */
.search {
  width: 100%; padding: 10px 14px; border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,0.1); background: var(--card);
  color: var(--text); font-size: 14px; margin-bottom: 12px; outline: none;
}
.search::placeholder { color: var(--text3); }
.user-list { display: flex; flex-direction: column; gap: 8px; }
.user-row {
  background: var(--card); border-radius: var(--radius); padding: 12px;
  display: flex; align-items: center; gap: 10px;
  -webkit-tap-highlight-color: transparent;
}
.user-row .avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--card2); display: flex; align-items: center;
  justify-content: center; font-size: 16px; font-weight: 600;
}
.user-row .info { flex: 1; min-width: 0; }
.user-row .name { font-size: 14px; font-weight: 500; }
.user-row .sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.badge {
  display: inline-block; padding: 2px 7px; border-radius: 6px;
  font-size: 10px; font-weight: 600;
}
.badge.active { background: rgba(102,187,106,0.2); color: var(--green); }
.badge.disabled { background: rgba(239,83,80,0.2); color: var(--red); }
.badge.expired { background: rgba(255,167,38,0.2); color: var(--yellow); }
.traffic-bar {
  height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px;
  margin-top: 4px; overflow: hidden;
}
.traffic-bar .fill { height: 100%; border-radius: 2px; background: var(--accent); }

/* Finance */
.fin-cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.fin-card {
  background: var(--card); border-radius: var(--radius); padding: 14px;
  display: flex; justify-content: space-between; align-items: center;
}
.fin-card .label { font-size: 13px; color: var(--text2); }
.fin-card .val { font-size: 20px; font-weight: 700; color: var(--green); }

/* Transactions */
.tx-list { display: flex; flex-direction: column; gap: 8px; }
.tx-item {
  background: var(--card); border-radius: var(--radius); padding: 12px;
  display: flex; justify-content: space-between; align-items: center;
}
.tx-item .left .who { font-size: 13px; }
.tx-item .left .when { font-size: 11px; color: var(--text2); margin-top: 2px; }
.tx-item .amount { font-size: 15px; font-weight: 600; color: var(--green); }

/* User detail modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  z-index: 200; justify-content: center; align-items: flex-end;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg2); border-radius: 16px 16px 0 0;
  width: 100%; max-height: 85vh; overflow-y: auto;
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
}
.modal .close {
  float: right; background: none; border: none;
  color: var(--text2); font-size: 24px; padding: 4px;
}
.modal h2 { font-size: 18px; margin-bottom: 16px; }
.modal .row {
  display: flex; justify-content: space-between; padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px;
}
.modal .row .lbl { color: var(--text2); }
.btn {
  width: 100%; padding: 12px; border-radius: var(--radius);
  border: none; font-size: 14px; font-weight: 600;
  margin-top: 10px; -webkit-tap-highlight-color: transparent;
}
.btn-green { background: var(--green); color: #fff; }
.btn-red { background: var(--red); color: #fff; }
.btn-outline {
  background: transparent; border: 1px solid rgba(255,255,255,0.2);
  color: var(--text);
}

/* Loading */
.loading { text-align: center; padding: 40px; color: var(--text2); }
</style>
</head>
<body>

<div class="header"><h1>⚙️ Nemo Tracker</h1></div>

<!-- Dashboard -->
<div class="tab active" id="tab-dashboard">
  <div class="cards" id="stats-cards"></div>
  <div class="chart-wrap">
    <h3>Доход за 7 дней</h3>
    <canvas id="chart7d"></canvas>
  </div>
  <h3 style="font-size:14px;margin-bottom:8px;">Последние алерты</h3>
  <div class="alerts-mini" id="dash-alerts"></div>
</div>

<!-- Users -->
<div class="tab" id="tab-users">
  <input class="search" id="user-search" placeholder="🔍 Поиск пользователя...">
  <div class="user-list" id="user-list"></div>
</div>

<!-- Finance -->
<div class="tab" id="tab-finance">
  <div class="fin-cards" id="fin-cards"></div>
  <h3 style="font-size:14px;margin-bottom:8px;">Последние транзакции</h3>
  <div class="tx-list" id="tx-list"></div>
</div>

<!-- Alerts -->
<div class="tab" id="tab-alerts">
  <div class="user-list" id="alert-list"></div>
</div>

<!-- User detail modal -->
<div class="modal-overlay" id="user-modal">
  <div class="modal" id="modal-content"></div>
</div>

<!-- Bottom nav -->
<div class="nav">
  <button class="active" data-tab="dashboard"><span class="ico">📊</span>Главная</button>
  <button data-tab="users"><span class="ico">👥</span>Пользователи</button>
  <button data-tab="finance"><span class="ico">💰</span>Финансы</button>
  <button data-tab="alerts"><span class="ico">🔔</span>Алерты</button>
</div>

<script>
const TG = window.Telegram && Telegram.WebApp;
if (TG) { TG.ready(); TG.expand(); }

let token = null;
let usersCache = [];

// --- Init ---
async function init() {
  if (TG && TG.initData) {
    try {
      const r = await fetch('/api/mini/verify', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({init_data: TG.initData})
      });
      const d = await r.json();
      if (d.ok) token = d.token;
      else { document.body.innerHTML = '<div class="loading">⛔ Ошибка авторизации</div>'; return; }
    } catch(e) { console.error(e); }
  }
  loadDashboard();
}

async function api(url, opts = {}) {
  const headers = opts.headers || {};
  if (token) headers['X-Mini-Token'] = token;
  headers['Content-Type'] = 'application/json';
  const r = await fetch(url, {...opts, headers});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

// --- Nav ---
document.querySelectorAll('.nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    if (btn.dataset.tab === 'users' && !usersCache.length) loadUsers();
    if (btn.dataset.tab === 'finance') loadFinance();
    if (btn.dataset.tab === 'alerts') loadAlerts();
  });
});

// --- Dashboard ---
async function loadDashboard() {
  try {
    const d = await api('/api/mini/init');
    const s = d.stats;
    document.getElementById('stats-cards').innerHTML = `
      <div class="card"><div class="label">Всего пользователей</div><div class="value">${s.total_users}</div></div>
      <div class="card"><div class="label">Активных</div><div class="value green">${s.active_users}</div></div>
      <div class="card"><div class="label">Онлайн сейчас</div><div class="value blue">${s.online_now}</div></div>
      <div class="card"><div class="label">Доход сегодня</div><div class="value green">${s.revenue_today} ₽</div></div>
    `;
    // Alerts
    const ae = document.getElementById('dash-alerts');
    ae.innerHTML = (d.recent_alerts || []).slice(0,3).map(a => `
      <div class="alert-item">
        <span class="icon">${a.type==='traffic'?'⚠️':a.type==='expired'?'🔴':'🟡'}</span>
        <span class="msg">${a.message}</span>
        <span class="time">${a.time}</span>
      </div>
    `).join('') || '<div class="alert-item"><span class="msg" style="color:var(--text2)">Нет алертов</span></div>';
    // Chart
    drawChart(d.revenue_7d || []);
  } catch(e) { console.error(e); }
}

function drawChart(data) {
  const canvas = document.getElementById('chart7d');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = 120 * dpr;
  ctx.scale(dpr, dpr);
  const w = rect.width, h = 120;
  if (!data.length) { ctx.fillStyle='#616161'; ctx.font='13px sans-serif'; ctx.fillText('Нет данных',w/2-30,h/2); return; }
  const max = Math.max(...data.map(d=>d.rub), 1);
  const pad = 10;
  const step = (w - pad*2) / (data.length - 1 || 1);
  ctx.strokeStyle = 'rgba(79,195,247,0.3)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad + (h - pad*2) * i / 4;
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(w-pad, y); ctx.stroke();
  }
  ctx.beginPath();
  ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 2;
  data.forEach((d,i) => {
    const x = pad + i * step;
    const y = h - pad - (d.rub / max) * (h - pad*2);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();
  // Fill
  const lastX = pad + (data.length-1)*step;
  ctx.lineTo(lastX, h-pad); ctx.lineTo(pad, h-pad); ctx.closePath();
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0, 'rgba(79,195,247,0.3)'); grad.addColorStop(1, 'rgba(79,195,247,0.01)');
  ctx.fillStyle = grad; ctx.fill();
  // Labels
  ctx.fillStyle = '#9e9e9e'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  data.forEach((d,i) => {
    if (i % 2 === 0 || data.length <= 4) ctx.fillText(d.date, pad + i*step, h-1);
  });
}

// --- Users ---
async function loadUsers() {
  try {
    usersCache = await api('/api/users');
    renderUsers(usersCache);
  } catch(e) { console.error(e); }
}

function renderUsers(list) {
  const el = document.getElementById('user-list');
  el.innerHTML = list.map(u => {
    const badge = u.status === 'active' ? 'active' : u.status === 'disabled' ? 'disabled' : 'expired';
    const traffic = u.traffic_limit_gb ? Math.min(100, (u.traffic_used_gb/u.traffic_limit_gb)*100) : 0;
    return `<div class="user-row" onclick="openUser('${u.username}')">
      <div class="avatar">${u.username[0].toUpperCase()}</div>
      <div class="info">
        <div class="name">${u.username} <span class="badge ${badge}">${u.status}</span></div>
        <div class="sub">${u.traffic_used_gb} / ${u.traffic_limit_gb || '∞'} ГБ · ${u.expire || '∞'} · ${u.devices} устр.</div>
        <div class="traffic-bar"><div class="fill" style="width:${traffic}%;background:${traffic>80?'var(--red)':traffic>50?'var(--yellow)':'var(--accent)'}"></div></div>
      </div>
    </div>`;
  }).join('') || '<div class="loading">Нет пользователей</div>';
}

document.getElementById('user-search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  renderUsers(usersCache.filter(u => u.username.toLowerCase().includes(q)));
});

// --- User detail ---
async function openUser(username) {
  try {
    const u = await api(`/api/users/${username}`);
    const badge = u.status === 'active' ? 'active' : u.status === 'disabled' ? 'disabled' : 'expired';
    document.getElementById('modal-content').innerHTML = `
      <button class="close" onclick="closeModal()">&times;</button>
      <h2>${u.username} <span class="badge ${badge}">${u.status}</span></h2>
      <div class="row"><span class="lbl">Трафик</span><span>${u.traffic_used_gb} / ${u.traffic_limit_gb || '∞'} ГБ</span></div>
      <div class="row"><span class="lbl">Устройства</span><span>${u.devices} / ${u.device_limit || '∞'}</span></div>
      <div class="row"><span class="lbl">Создан</span><span>${u.created}</span></div>
      <div class="row"><span class="lbl">Истекает</span><span>${u.expire || '∞'}</span></div>
      <div class="row"><span class="lbl">Тариф</span><span>${u.tier_name}</span></div>
      <button class="btn ${u.status === 'active' ? 'btn-red' : 'btn-green'}" onclick="toggleUser('${u.username}','${u.status}')">
        ${u.status === 'active' ? '⏸ Отключить' : '▶ Включить'}
      </button>
      <button class="btn btn-outline" onclick="resetTraffic('${u.username}')">🔄 Сбросить трафик</button>
    `;
    document.getElementById('user-modal').classList.add('show');
  } catch(e) { console.error(e); }
}

function closeModal() { document.getElementById('user-modal').classList.remove('show'); }
document.getElementById('user-modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });

async function toggleUser(username, status) {
  try {
    const newStatus = status === 'active' ? 'disabled' : 'active';
    await api(`/api/users/${username}/toggle`, {method: 'POST', body: JSON.stringify({status: newStatus})});
    closeModal();
    loadUsers();
    loadDashboard();
  } catch(e) { alert('Ошибка: ' + e.message); }
}

async function resetTraffic(username) {
  if (!confirm('Сбросить трафик?')) return;
  try {
    await api(`/api/users/${username}/reset-traffic`, {method: 'POST'});
    closeModal();
    loadUsers();
  } catch(e) { alert('Ошибка: ' + e.message); }
}

// --- Finance ---
async function loadFinance() {
  try {
    const [summary, txs] = await Promise.all([api('/api/finance/summary'), api('/api/finance/transactions')]);
    const s = summary;
    document.getElementById('fin-cards').innerHTML = `
      <div class="fin-card"><span class="label">Сегодня</span><span class="val">${s.today ? s.today.rub : 0} ₽</span></div>
      <div class="fin-card"><span class="label">Неделя</span><span class="val">${s.week ? s.week.rub : 0} ₽</span></div>
      <div class="fin-card"><span class="label">Месяц</span><span class="val">${s.month ? s.month.rub : 0} ₽</span></div>
    `;
    document.getElementById('tx-list').innerHTML = (txs.transactions || []).slice(0,5).map(t => `
      <div class="tx-item">
        <div class="left">
          <div class="who">${t.username || t.description || '—'}</div>
          <div class="when">${t.created_at ? new Date(t.created_at).toLocaleDateString('ru') : ''}</div>
        </div>
        <div class="amount">${t.amount || 0} ₽</div>
      </div>
    `).join('') || '<div class="loading">Нет транзакций</div>';
  } catch(e) { console.error(e); }
}

// --- Alerts ---
async function loadAlerts() {
  try {
    const d = await api('/api/mini/init');
    const alerts = d.recent_alerts || [];
    document.getElementById('alert-list').innerHTML = alerts.map(a => {
      const icon = a.type === 'traffic' ? '⚠️' : a.type === 'expired' ? '🔴' : '🟡';
      return `<div class="alert-item" style="cursor:pointer" onclick="${a.username ? `openUser('${a.username}')` : ''}">
        <span class="icon">${icon}</span>
        <div style="flex:1"><div class="msg">${a.message}</div></div>
        <span class="time">${a.time}</span>
      </div>`;
    }).join('') || '<div class="loading">Нет алертов 🎉</div>';
  } catch(e) { console.error(e); }
}

init();
</script>
</body>
</html>
