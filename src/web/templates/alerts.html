{% extends "base.html" %}
{% block title %}Alerts — Nemo Tracker{% endblock %}
{% block topbar_title %}nav.alerts{% endblock %}

{% block content %}
<div class="toolbar">
  <div class="filter-group" id="alertFilters">
    <button class="filter-btn active" data-type="all" onclick="setAlertFilter('all',this)" data-i18n="alerts.all">All</button>
    <button class="filter-btn" data-type="device" onclick="setAlertFilter('device',this)"><i class="fas fa-laptop"></i> Device</button>
    <button class="filter-btn" data-type="traffic" onclick="setAlertFilter('traffic',this)"><i class="fas fa-chart-line"></i> Traffic</button>
    <button class="filter-btn" data-type="expire" onclick="setAlertFilter('expire',this)"><i class="fas fa-clock"></i> Expire</button>
  </div>
</div>

<div class="glass-card" style="padding:0;overflow:hidden">
  <div class="table-wrap">
    <table class="data-table">
      <thead><tr>
        <th data-i18n="alerts.type">Type</th>
        <th data-i18n="alerts.message">Message</th>
        <th data-i18n="alerts.time">Time</th>
        <th data-i18n="alerts.status">Status</th>
        <th></th>
      </tr></thead>
      <tbody id="alertsBody"></tbody>
    </table>
  </div>
</div>

<div id="alertsLoading"><div class="spinner"></div></div>
{% endblock %}

{% block scripts %}
<script>
let allAlerts = [];
let alertFilter = 'all';

function alertIcon(type) {
  if (type === 'device') return 'fa-laptop';
  if (type === 'traffic') return 'fa-chart-line';
  if (type === 'expire') return 'fa-clock';
  return 'fa-info-circle';
}

function formatAlertTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return t('alerts.just_now') || 'just now';
  if (diff < 3600) return Math.floor(diff/60) + ' min';
  if (diff < 86400) return Math.floor(diff/3600) + 'h';
  return d.toLocaleDateString();
}

function renderAlerts() {
  const filtered = alertFilter === 'all' ? allAlerts : allAlerts.filter(a => a.type === alertFilter);
  const tbody = document.getElementById('alertsBody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:40px" data-i18n="alerts.no_alerts">${t('alerts.no_alerts')}</td></tr>`;
    return;
  }
  tbody.innerHTML = filtered.map(a => `
    <tr>
      <td><i class="fas ${alertIcon(a.type)}" style="color:var(--primary)"></i> ${a.type}</td>
      <td>${a.message}</td>
      <td style="color:var(--text-3);font-size:13px">${formatAlertTime(a.time)}</td>
      <td><span class="badge ${a.resolved ? 'badge-resolved' : 'badge-unresolved'}">${a.resolved ? t('alerts.resolved') : t('alerts.unresolved')}</span></td>
      <td>${!a.resolved ? `<button class="btn btn-sm btn-secondary" onclick="resolveAlert(${a.id},this)">${t('alerts.resolve')}</button>` : ''}</td>
    </tr>
  `).join('');
}

function setAlertFilter(type, btn) {
  alertFilter = type;
  document.querySelectorAll('#alertFilters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAlerts();
}

async function resolveAlert(id, btn) {
  try {
    await fetchApi('/api/alerts/' + id + '/resolve', { method: 'POST' });
    btn.closest('tr').querySelector('.badge').className = 'badge badge-resolved';
    btn.closest('tr').querySelector('.badge').textContent = t('alerts.resolved');
    btn.remove();
  } catch {}
}

async function onPageLoad() {
  try {
    allAlerts = await fetchApi('/api/alerts');
    document.getElementById('alertsLoading').style.display = 'none';
    renderAlerts();
  } catch (e) {
    document.getElementById('alertsLoading').innerHTML = '<p style="text-align:center;color:var(--accent-red)">Failed to load</p>';
  }
}

function onPageLangChange() { onPageLoad(); }
</script>
{% endblock %}
