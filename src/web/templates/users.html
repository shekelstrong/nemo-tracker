{% extends "base.html" %}
{% block title %}Users — Nemo Tracker{% endblock %}
{% block nav_users %}active{% endblock %}
{% block page_title %}Users{% endblock %}

{% block content %}
<div class="glass-card p-4 mb-4">
  <div class="flex flex-col sm:flex-row gap-3 items-start sm:items-center justify-between mb-4">
    <input id="search" type="text" placeholder="Search users..."
      class="bg-white/5 border border-white/10 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-400 w-full sm:w-64" />
    <div class="flex gap-2 text-xs">
      <button onclick="filterStatus('')" class="px-3 py-1 rounded-full bg-white/10 hover:bg-brand-500/30 transition">All</button>
      <button onclick="filterStatus('active')" class="px-3 py-1 rounded-full bg-white/10 hover:bg-green-500/30 transition">Active</button>
      <button onclick="filterStatus('disabled')" class="px-3 py-1 rounded-full bg-white/10 hover:bg-red-500/30 transition">Disabled</button>
      <button onclick="filterStatus('expired')" class="px-3 py-1 rounded-full bg-white/10 hover:bg-yellow-500/30 transition">Expired</button>
    </div>
  </div>
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="text-gray-400 text-left border-b border-white/5">
          <th class="pb-2 cursor-pointer" onclick="sortTable('username')">Username <i class="fas fa-sort text-xs"></i></th>
          <th class="pb-2">Status</th>
          <th class="pb-2 cursor-pointer" onclick="sortTable('traffic_used')">Traffic</th>
          <th class="pb-2">Devices</th>
          <th class="pb-2 cursor-pointer" onclick="sortTable('last_online')">Last Online</th>
          <th class="pb-2">Expire</th>
        </tr>
      </thead>
      <tbody id="users-tbody"></tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let users = [];
let currentSort = { key: 'username', asc: true };
let statusFilter = '';

async function loadUsers() {
  users = await (await fetch('/api/users')).json();
  render();
}

function sortTable(key) {
  if (currentSort.key === key) currentSort.asc = !currentSort.asc;
  else { currentSort.key = key; currentSort.asc = true; }
  render();
}

function filterStatus(s) { statusFilter = s; render(); }

function render() {
  let list = [...users];
  const q = document.getElementById('search').value.toLowerCase();
  if (q) list = list.filter(u => u.username.toLowerCase().includes(q));
  if (statusFilter) list = list.filter(u => u.status === statusFilter);

  list.sort((a, b) => {
    let va = a[currentSort.key], vb = b[currentSort.key];
    if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    return currentSort.asc ? (va > vb ? 1 : -1) : (va < vb ? 1 : -1);
  });

  const statusBadge = s => {
    const c = { active: 'bg-green-500/20 text-green-400', disabled: 'bg-red-500/20 text-red-400',
      expired: 'bg-yellow-500/20 text-yellow-400' }[s] || 'bg-gray-500/20 text-gray-400';
    return `<span class="px-2 py-0.5 rounded-full text-xs ${c}">${s}</span>`;
  };

  document.getElementById('users-tbody').innerHTML = list.map(u => {
    const pct = u.traffic_limit ? Math.round(u.traffic_used / u.traffic_limit * 100) : 0;
    return `<tr class="border-b border-white/5 hover:bg-white/5 cursor-pointer" onclick="location.href='/users/${u.username}'">
      <td class="py-3 font-medium text-white">${u.username}</td>
      <td class="py-3">${statusBadge(u.status)}</td>
      <td class="py-3"><div class="flex items-center gap-2">
        <div class="w-20 bg-white/10 rounded-full h-1.5"><div class="h-1.5 rounded-full bg-brand-400" style="width:${pct}%"></div></div>
        <span class="text-xs text-gray-400">${u.traffic_used}/${u.traffic_limit} GB</span></div></td>
      <td class="py-3">${u.devices}</td>
      <td class="py-3 text-gray-400">${new Date(u.last_online).toLocaleString()}</td>
      <td class="py-3 text-gray-400">${u.expire}</td>
    </tr>`;
  }).join('');
}

document.getElementById('search').addEventListener('input', render);
loadUsers();
</script>
{% endblock %}
