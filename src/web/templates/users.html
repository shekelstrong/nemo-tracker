{% extends "base.html" %}
{% block title %}Users — Nemo Tracker{% endblock %}
{% block topbar_title %}nav.users{% endblock %}

{% block content %}
<div class="toolbar">
  <input class="search-input" id="searchInput" data-i18n-placeholder="users.search" placeholder="Search users..." oninput="filterUsers()">
  <div class="filter-group" id="statusFilters">
    <button class="filter-btn active" data-status="all" onclick="setStatusFilter('all',this)" data-i18n="users.all">All</button>
    <button class="filter-btn" data-status="active" onclick="setStatusFilter('active',this)" data-i18n="users.active">Active</button>
    <button class="filter-btn" data-status="expired" onclick="setStatusFilter('expired',this)" data-i18n="users.expired">Expired</button>
    <button class="filter-btn" data-status="disabled" onclick="setStatusFilter('disabled',this)" data-i18n="users.disabled">Disabled</button>
    <button class="filter-btn" data-status="limited" onclick="setStatusFilter('limited',this)" data-i18n="users.limited">Limited</button>
  </div>
</div>

<div class="glass-card" style="padding:0;overflow:hidden">
  <div class="table-wrap">
    <table class="data-table" id="usersTable">
      <thead>
        <tr>
          <th onclick="sortBy('username')"><span data-i18n="users.username">Username</span> <i class="fas fa-sort sort-icon"></i></th>
          <th onclick="sortBy('status')"><span data-i18n="users.status">Status</span> <i class="fas fa-sort sort-icon"></i></th>
          <th data-i18n="users.traffic">Traffic</th>
          <th data-i18n="users.devices">Devices</th>
          <th onclick="sortBy('last_online')"><span data-i18n="users.last_online">Last Online</span> <i class="fas fa-sort sort-icon"></i></th>
          <th data-i18n="users.tier">Tier</th>
        </tr>
      </thead>
      <tbody id="usersBody"></tbody>
    </table>
  </div>
</div>

<div id="usersLoading"><div class="spinner"></div></div>
{% endblock %}

{% block scripts %}
<script>
let allUsers = [];
let currentFilter = 'all';
let currentSort = { key: null, asc: true };

function badgeClass(status) {
  return 'badge badge-' + ({ active: 'active', expired: 'expired', disabled: 'disabled', limited: 'limited' }[status] || 'expired');
}

function statusLabel(status) {
  return t('users.' + status) || status;
}

function trafficBar(pct) {
  if (pct === null || pct === undefined) return `<span style="color:var(--text-3)">∞</span>`;
  const color = pct > 90 ? 'red' : pct > 70 ? 'orange' : 'green';
  return `<div class="traffic-cell"><div class="progress-bar"><div class="fill ${color}" style="width:${Math.min(pct,100)}%"></div></div><span class="pct">${pct}%</span></div>`;
}

function formatTime(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString() + ' ' + d.toLocaleTimeString().slice(0,5);
}

function renderUsers(users) {
  const tbody = document.getElementById('usersBody');
  if (!users.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-3);padding:40px">No users found</td></tr>';
    return;
  }
  tbody.innerHTML = users.map(u => `
    <tr onclick="location.href='/users/${u.username}'">
      <td><div class="user-cell"><div class="avatar">${u.username[0].toUpperCase()}</div>${u.username}</div></td>
      <td><span class="${badgeClass(u.status)}">${statusLabel(u.status)}</span></td>
      <td>${trafficBar(u.traffic_pct)}</td>
      <td>${u.devices}</td>
      <td>${formatTime(u.last_online)}</td>
      <td>${u.tier || '—'}</td>
    </tr>
  `).join('');
}

function filterUsers() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let filtered = allUsers.filter(u => {
    if (currentFilter !== 'all' && u.status !== currentFilter) return false;
    if (q && !u.username.toLowerCase().includes(q)) return false;
    return true;
  });
  if (currentSort.key) {
    filtered.sort((a, b) => {
      let va = a[currentSort.key] || '', vb = b[currentSort.key] || '';
      if (typeof va === 'number') return currentSort.asc ? va - vb : vb - va;
      return currentSort.asc ? String(va).localeCompare(String(vb)) : String(vb).localeCompare(String(va));
    });
  }
  renderUsers(filtered);
}

function setStatusFilter(status, btn) {
  currentFilter = status;
  document.querySelectorAll('#statusFilters .filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterUsers();
}

function sortBy(key) {
  if (currentSort.key === key) currentSort.asc = !currentSort.asc;
  else { currentSort.key = key; currentSort.asc = true; }
  filterUsers();
}

async function onPageLoad() {
  try {
    allUsers = await fetchApi('/api/users');
    document.getElementById('usersLoading').style.display = 'none';
    filterUsers();
  } catch (e) {
    document.getElementById('usersLoading').innerHTML = '<p style="text-align:center;color:var(--accent-red)">Failed to load users</p>';
  }
}

function onPageLangChange() { onPageLoad(); }
</script>
{% endblock %}
