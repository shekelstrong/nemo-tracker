<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Nemo Tracker{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 400: '#7c3aed', 500: '#6d28d9', 600: '#5b21b6', 700: '#4c1d95' },
            surface: { 800: '#1a1a2e', 900: '#0f0f1a', 700: '#24243e' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-surface-900 text-gray-200 min-h-screen flex" x-data="{ sidebarOpen: true }">

  <!-- Sidebar -->
  <aside :class="sidebarOpen ? 'w-60' : 'w-0 overflow-hidden'"
         class="bg-surface-800/80 backdrop-blur-xl border-r border-white/5 transition-all duration-300 flex flex-col fixed h-full z-40 lg:relative">
    <!-- Logo -->
    <div class="flex items-center gap-3 px-5 py-5 border-b border-white/5">
      <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-brand-400 to-brand-600 flex items-center justify-center">
        <i class="fas fa-shield-halved text-white text-sm"></i>
      </div>
      <span class="font-bold text-lg tracking-wide text-white">Nemo Tracker</span>
    </div>
    <!-- Nav -->
    <nav class="flex-1 py-4 space-y-1 px-3">
      <a href="/" class="nav-link {% block nav_dashboard %}{% endblock %}">
        <i class="fas fa-chart-pie w-5"></i> Dashboard
      </a>
      <a href="/users" class="nav-link {% block nav_users %}{% endblock %}">
        <i class="fas fa-users w-5"></i> Users
      </a>
      <a href="/devices" class="nav-link {% block nav_devices %}{% endblock %}">
        <i class="fas fa-laptop w-5"></i> Devices
      </a>
      <a href="/alerts" class="nav-link {% block nav_alerts %}{% endblock %}">
        <i class="fas fa-bell w-5"></i> Alerts
      </a>
      <a href="/settings" class="nav-link {% block nav_settings %}{% endblock %}">
        <i class="fas fa-cog w-5"></i> Settings
      </a>
    </nav>
    <div class="px-5 py-4 border-t border-white/5 text-xs text-gray-500">
      &copy; 2026 Nemo Tracker
    </div>
  </aside>

  <!-- Main content -->
  <div class="flex-1 flex flex-col min-h-screen overflow-x-hidden">
    <!-- Top bar -->
    <header class="sticky top-0 z-30 bg-surface-900/70 backdrop-blur-xl border-b border-white/5 flex items-center gap-4 px-4 py-3 lg:px-6">
      <button @click="sidebarOpen = !sidebarOpen" class="text-gray-400 hover:text-white lg:hidden">
        <i class="fas fa-bars text-lg"></i>
      </button>
      <h1 class="text-lg font-semibold text-white">{% block page_title %}{% endblock %}</h1>
      <div class="ml-auto flex items-center gap-3">
        <span class="text-xs text-gray-500" id="ws-status"><i class="fas fa-circle text-green-400"></i> Live</span>
      </div>
    </header>

    <!-- Page content -->
    <main class="flex-1 p-4 lg:p-6">
      {% block content %}{% endblock %}
    </main>
  </div>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
