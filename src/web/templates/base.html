<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Nemo Tracker{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<div class="layout">
  <!-- Sidebar Overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="logo">N</div>
      <span>Nemo Tracker</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="{% if page == 'dashboard' %}active{% endif %}">
        <i class="fas fa-chart-pie"></i> <span data-i18n="nav.dashboard">Dashboard</span>
      </a>
      <a href="/users" class="{% if page == 'users' or page == 'user_detail' %}active{% endif %}">
        <i class="fas fa-users"></i> <span data-i18n="nav.users">Users</span> <span id="onlineBadge" class="sidebar-badge" style="display:none">0</span>
      </a>
      <a href="/devices" class="{% if page == 'devices' %}active{% endif %}">
        <i class="fas fa-laptop"></i> <span data-i18n="nav.devices">Devices</span>
      </a>
      <a href="/alerts" class="{% if page == 'alerts' %}active{% endif %}">
        <i class="fas fa-bell"></i> <span data-i18n="nav.alerts">Alerts</span>
      </a>
      <a href="/servers" class="{% if page == 'servers' %}active{% endif %}">
        <i class="fas fa-globe"></i> <span data-i18n="nav.servers">🌐 Servers</span>
      </a>
      <a href="/finance" class="{% if page == 'finance' %}active{% endif %}">
        <i class="fas fa-coins"></i> <span data-i18n="nav.finance">Finance</span>
      </a>
      <a href="/geo" class="{% if page == 'geo' %}active{% endif %}">
        <i class="fas fa-map-marked-alt"></i> <span data-i18n="nav.geo">Geo Map</span>
      </a>
      <a href="/analytics" class="{% if page == 'analytics' %}active{% endif %}">
        <i class="fas fa-chart-bar"></i> <span data-i18n="nav.analytics">Analytics</span>
      </a>
      <a href="/settings" class="{% if page == 'settings' %}active{% endif %}">
        <i class="fas fa-cog"></i> <span data-i18n="nav.settings">Settings</span>
      </a>
      <a href="/tariffs" class="{% if page == 'tariffs' %}active{% endif %}">
        <i class="fas fa-tags"></i> <span data-i18n="nav.tariffs">Tariffs</span>
      </a>
      <a href="/promocodes" class="{% if page == 'promocodes' %}active{% endif %}">
        <i class="fas fa-ticket-alt"></i> <span data-i18n="nav.promocodes">Promo Codes</span>
      </a>
      <a href="/resellers" class="{% if page == 'resellers' %}active{% endif %}">
        <i class="fas fa-user-friends"></i> <span data-i18n="nav.resellers">Resellers</span>
      </a>
      <a href="/export" class="{% if page == 'export' %}active{% endif %}">
        <i class="fas fa-clipboard-list"></i> <span data-i18n="nav.export">Export</span>
      </a>
      <a href="/auto-renewal" class="{% if page == 'auto-renewal' %}active{% endif %}">
        <i class="fas fa-sync-alt"></i> <span data-i18n="nav.auto_renewal">Auto-Renewal</span>
      </a>
    </nav>
    <div class="sidebar-footer" data-i18n="footer.version">Nemo Tracker v0.1 · Open Source</div>
  </aside>

  <!-- Main -->
  <div class="main">
    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
        <span class="topbar-title" data-i18n="{% block topbar_title %}nav.dashboard{% endblock %}">Dashboard</span>
      </div>
      <div class="topbar-actions">
        <button class="topbar-btn lang-btn" onclick="toggleLang()" title="Language">
          <span id="langLabel">🇷🇺</span>
        </button>
        <button class="topbar-btn" onclick="toggleTheme()" title="Toggle theme">
          <i class="fas fa-moon" id="themeIcon"></i>
        </button>
        <button class="topbar-btn" onclick="logout()" title="Выйти / Logout" style="margin-left:0.25rem;">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </header>

    <!-- Content -->
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="/static/js/i18n.js"></script>
<script src="/static/js/app.js"></script>
<script>
  // Update theme icon & lang label on load
  const themeIcon = document.getElementById('themeIcon');
  const langLabel = document.getElementById('langLabel');
  function updateThemeIcon() {
    const isDark = document.documentElement.classList.contains('dark');
    themeIcon.className = isDark ? 'fas fa-moon' : 'fas fa-sun';
  }
  function updateLangLabel() {
    langLabel.textContent = getLang() === 'en' ? '🇷🇺' : '🇬🇧';
  }
  const origToggleTheme = toggleTheme;
  toggleTheme = function() { origToggleTheme(); updateThemeIcon(); };
  const origToggleLang = toggleLang;
  toggleLang = function() { origToggleLang(); updateLangLabel(); };
  document.addEventListener('DOMContentLoaded', () => { updateThemeIcon(); updateLangLabel(); });

  async function logout() {
    await fetch('/api/auth/logout', {method:'POST'});
    window.location.href = '/login';
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
