<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Nemo Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f172a; --surface: rgba(30, 41, 59, 0.7); --border: rgba(255,255,255,0.08);
      --text: #e2e8f0; --muted: #94a3b8; --accent: #6366f1; --accent-hover: #818cf8;
      --danger: #ef4444; --success: #10b981;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(99,102,241,0.08) 0%, transparent 50%),
                         radial-gradient(ellipse at 80% 50%, rgba(139,92,246,0.06) 0%, transparent 50%);
    }
    .login-card {
      width: 100%; max-width: 400px; padding: 2.5rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 1rem; backdrop-filter: blur(20px);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    .logo { font-size: 2rem; font-weight: 800; text-align: center; margin-bottom: 0.25rem; }
    .logo span { color: var(--accent); }
    .subtitle { text-align: center; color: var(--muted); font-size: 0.9rem; margin-bottom: 2rem; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-bottom: 0.4rem; }
    .form-input {
      width: 100%; padding: 0.7rem 0.9rem; border-radius: 0.5rem;
      background: rgba(255,255,255,0.05); border: 1px solid var(--border);
      color: var(--text); font-size: 0.95rem; transition: border-color 0.2s;
    }
    .form-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .btn-login {
      width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: none;
      background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .btn-login:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error-msg { color: var(--danger); font-size: 0.85rem; text-align: center; margin-bottom: 1rem; min-height: 1.2em; }
    .totp-section { display: none; }
    .totp-section.active { display: block; }
    .back-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.85rem; margin-bottom: 1rem; display: inline-flex; align-items: center; gap: 0.3rem;
    }
    .back-btn:hover { color: var(--text); }
    .spinner { display: none; width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">N<span>emo</span></div>
    <div class="subtitle" id="subtitle">Войдите в панель управления / Sign in</div>

    <div id="error" class="error-msg"></div>

    <!-- Step 1: Credentials -->
    <form id="credentialsForm">
      <div class="form-group">
        <label>Username</label>
        <input id="username" type="text" class="form-input" placeholder="admin" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label>Пароль / Password</label>
        <input id="password" type="password" class="form-input" placeholder="••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-login" id="loginBtn">
        <div class="spinner" id="spinner1"></div>
        <span>Войти / Sign in</span>
      </button>
    </form>

    <!-- Step 2: 2FA -->
    <div id="totpSection" class="totp-section">
      <button class="back-btn" onclick="backToCredentials()">
        <i class="fas fa-arrow-left"></i> Назад / Back
      </button>
      <div class="form-group">
        <label>Код 2FA / 2FA Code</label>
        <input id="totpCode" type="text" class="form-input" placeholder="123456" autocomplete="one-time-code" maxlength="6" inputmode="numeric" />
      </div>
      <button onclick="submitTotp()" class="btn-login" id="totpBtn">
        <div class="spinner" id="spinner2"></div>
        <span>Подтвердить / Verify</span>
      </button>
    </div>
  </div>

<script>
  let pendingUsername = '';
  let pendingPassword = '';

  document.getElementById('credentialsForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('error');
    errEl.textContent = '';
    const btn = document.getElementById('loginBtn');
    const spinner = document.getElementById('spinner1');
    btn.disabled = true; spinner.style.display = 'block';

    try {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      const data = await res.json();

      if (data.require_2fa) {
        pendingUsername = username;
        pendingPassword = password;
        document.getElementById('credentialsForm').style.display = 'none';
        document.getElementById('totpSection').classList.add('active');
        document.getElementById('subtitle').textContent = 'Введите код из приложения / Enter authenticator code';
        document.getElementById('totpCode').focus();
        return;
      }

      if (!res.ok) {
        errEl.textContent = data.detail || 'Ошибка входа / Login failed';
        return;
      }

      window.location.href = '/';
    } catch (err) {
      errEl.textContent = 'Ошибка сети / Network error';
    } finally {
      btn.disabled = false; spinner.style.display = 'none';
    }
  });

  async function submitTotp() {
    const errEl = document.getElementById('error');
    errEl.textContent = '';
    const btn = document.getElementById('totpBtn');
    const spinner = document.getElementById('spinner2');
    btn.disabled = true; spinner.style.display = 'block';

    try {
      const code = document.getElementById('totpCode').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: pendingUsername, password: pendingPassword, totp_code: code})
      });
      const data = await res.json();

      if (!res.ok) {
        errEl.textContent = data.detail || 'Неверный код / Invalid code';
        return;
      }

      window.location.href = '/';
    } catch (err) {
      errEl.textContent = 'Ошибка сети / Network error';
    } finally {
      btn.disabled = false; spinner.style.display = 'none';
    }
  }

  function backToCredentials() {
    document.getElementById('totpSection').classList.remove('active');
    document.getElementById('credentialsForm').style.display = 'block';
    document.getElementById('subtitle').textContent = 'Войдите в панель управления / Sign in';
    document.getElementById('error').textContent = '';
    document.getElementById('totpCode').value = '';
  }

  // Enter key for 2FA
  document.getElementById('totpCode').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') submitTotp();
  });
</script>
</body>
</html>
